services:
  hoarder:
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-release}
    restart: unless-stopped
    container_name: hoarder
    volumes:
      - ~/volumes/hoarder:/data
    env_file:
      - .env
    environment:
      MEILI_ADDR: http://hoarder-meilisearch:7700
      BROWSER_WEB_URL: http://hoarder-chrome:9222
      DATA_DIR: /data
    labels:
      - "homepage.group=Web"
      - "homepage.name=Hoarder"
      - "homepage.icon=karakeep.svg"
      - "homepage.href=https://${HOARDER_ENDPOINT_URL}"
      - "homepage.description=Bookmark manager with a focus on privacy and security."
    depends_on:
      - hoarder-chrome
      - hoarder-meilisearch
      - traefik
    networks:
      - frontend
  hoarder-chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    restart: unless-stopped
    init: true
    container_name: hoarder-chrome
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
    networks:
      - frontend
  hoarder-meilisearch:
    image: getmeili/meilisearch:v1.11.1
    restart: unless-stopped
    container_name: hoarder-meilisearch
    env_file:
      - .env
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ~/volumes/meili:/meili_data
    networks:
      - frontend
